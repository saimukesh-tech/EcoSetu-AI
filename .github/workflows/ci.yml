name: EcoSetu AI CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Build & Typecheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Run Frontend Security Audit
        run: cd frontend && npm audit --audit-level=high || true

      - name: Build & Typecheck Frontend
        run: cd frontend && npm run build

  backend-test-and-build:
    name: Test & Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Run Backend Security Audit
        run: cd backend && npm audit --audit-level=high || true

      - name: Run Backend Unit Tests
        run: cd backend && npm test -- --runInBand

      - name: Build & Typecheck Backend
        run: cd backend && npm run build

  ml-service-test:
    name: Test ML Service (Pytest & Pip-Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt pytest httpx pip-audit
      - name: Run Python Dependency Security Audit
        run: |
          cd ml-service
          python -m pip_audit || true
      - name: Run ML Pytest Suite
        run: |
          cd ml-service
          python -m pytest tests/
